name: Publish to npm

on:
  push:
    branches:
      - main
      - master

# Publishing uses npm Trusted Publishing (OIDC): no long-lived NPM_TOKEN is required.
# One-time: link this repo + workflow on npm → @habityzer/dbsync → Settings
# → Trusted publishing (see SETUP_NPM_PUBLISH.md). Optional legacy secret NPM_TOKEN if you
# have not enabled Trusted Publishing yet.

concurrency:
  group: npm-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # environment: npm   # uncomment if NPM_TOKEN is an Environment secret named on env "npm"
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # required for npm Trusted Publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git remote for semantic-release
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      # Trusted Publishing requires npm CLI ≥ 11.5.1 (Node’s bundled npm may be older).
      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g "npm@>=11.5.1" && npm --version

      # Avoid a leftover _authToken (e.g. from other tools) blocking OIDC; see actions/setup-node#1440.
      - name: Clear stale npm registry token
        run: npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25
          extra_plugins: |
            @semantic-release/commit-analyzer@^13.0.0
            @semantic-release/release-notes-generator@^14.0.0
            @semantic-release/changelog@^6.0.0
            @semantic-release/npm@^13.1.3
            @semantic-release/git@^10.0.0
            @semantic-release/github@^12.0.0
            conventional-changelog-conventionalcommits@^9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC path: leave unset / empty — @semantic-release/npm exchanges GitHub OIDC with npm.
          # Legacy fallback only until Trusted Publishing is configured on npmjs.com:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
