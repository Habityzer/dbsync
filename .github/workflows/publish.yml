name: Publish to npm

on:
  push:
    branches:
      - main
      - master

# Requires secret NPM_TOKEN (granular npm access token). If the token is stored on a
# GitHub Environment, add:  environment: <name>  to the job below so the secret is visible.

jobs:
  release:
    runs-on: ubuntu-latest
    # environment: npm   # uncomment if NPM_TOKEN is an Environment secret named on env "npm"
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git remote for semantic-release
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
        # Required so npm/pnpm get a registry auth line in .npmrc (whoami + publish).
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      # Fail fast: missing secret vs bad token. npm does not use NODE_AUTH_TOKEN without .npmrc;
      # setup-node writes that when NODE_AUTH_TOKEN is set on the Setup Node step (above).
      - name: Verify npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::secrets.NPM_TOKEN is empty for this job. Add a repository secret NPM_TOKEN on this repo, or grant org secret access, or set job.environment if the token is an Environment secret. See SETUP_NPM_PUBLISH.md."
            exit 1
          fi
          npm whoami --registry https://registry.npmjs.org/

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25
          extra_plugins: |
            @semantic-release/commit-analyzer@^13.0.0
            @semantic-release/release-notes-generator@^14.0.0
            @semantic-release/changelog@^6.0.0
            @semantic-release/npm@^13.0.0
            @semantic-release/git@^10.0.0
            @semantic-release/github@^12.0.0
            conventional-changelog-conventionalcommits@^9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
